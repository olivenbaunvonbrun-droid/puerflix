<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PuerFlix Safe Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }
    #player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #000000;
    }
    .loading-spinner {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 1;
      pointer-events: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="player-wrapper">
    <div id="spinner" class="loading-spinner"></div>
    <iframe
      id="yt-iframe"
      src="about:blank"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
      allowfullscreen
    ></iframe>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v') || urlParams.get('videoId') || '';
    const mode = urlParams.get('mode') || 'nocookie'; // default to nocookie for clean playback
    const baseHost = mode === 'standard' ? 'https://www.youtube.com' : 'https://www.youtube-nocookie.com';

    const iframe = document.getElementById('yt-iframe');
    const spinner = document.getElementById('spinner');

    if (videoId) {
      const embedUrl = baseHost + '/embed/' + encodeURIComponent(videoId) + 
        '?autoplay=1&controls=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&fs=1';
      iframe.src = embedUrl;
      iframe.onload = function() {
        if (spinner) spinner.style.display = 'none';
      };
    } else {
      if (spinner) spinner.style.display = 'none';
    }

    // Intercept window.open to prevent popup escapes
    window.open = function() { return null; };
  </script>
</body>
</html>
