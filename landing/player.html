<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>PuerFlix Safe Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }
    #player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #000000;
    }
    .loading-spinner {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 1;
      pointer-events: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Clean safety styles: Hide YouTube watermark & share button without tripping adblock checks */
    .ytp-impression-link,
    .ytp-youtube-button,
    .ytp-title-link,
    .ytp-watermark,
    .ytp-share-button {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <div id="player-wrapper">
    <div id="spinner" class="loading-spinner"></div>
    <iframe
      id="yt-iframe"
      src="about:blank"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
      allowfullscreen
    ></iframe>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v') || urlParams.get('videoId') || '';
    const mode = urlParams.get('mode') || 'standard'; // standard or nocookie
    const baseHost = mode === 'nocookie' ? 'https://www.youtube-nocookie.com' : 'https://www.youtube.com';

    const iframe = document.getElementById('yt-iframe');
    const spinner = document.getElementById('spinner');

    if (videoId) {
      // Must include origin and widget_referrer so YouTube verifies the embed domain and avoids Error 153
      const currentOrigin = window.location.origin || 'https://puerflix.vercel.app';
      const currentHref = window.location.href || 'https://puerflix.vercel.app/player';
      
      const embedUrl = baseHost + '/embed/' + encodeURIComponent(videoId) + 
        '?autoplay=1&controls=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&fs=1' +
        '&origin=' + encodeURIComponent(currentOrigin) +
        '&widget_referrer=' + encodeURIComponent(currentHref);

      iframe.src = embedUrl;
      iframe.onload = function() {
        if (spinner) spinner.style.display = 'none';
      };
    } else {
      if (spinner) spinner.style.display = 'none';
    }
  </script>
</body>
</html>
