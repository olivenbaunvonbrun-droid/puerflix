<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; background-color: #000; overflow: hidden; }
    .container { position: relative; width: 100%; height: 0; padding-bottom: 56.25%; }
    .video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="container"><div class="video" id="player"></div></div>
  <script>
    const randomPlayerId = "player" + Date.now();
    document.getElementById("player").id = randomPlayerId;
    const parsedUrl = new URL(window.location.href);
    const UrlQueryData = parsedUrl.searchParams.get("data");
    const {
      end, list, color, start, rel_s, loop_s, listType, playerLang, playlist,
      videoId_s, controls_s, cc_lang_pref_s, contentScale_s, allowWebViewZoom,
      modestbranding_s, iv_load_policy, preventFullScreen_s, showClosedCaptions_s
    } = JSON.parse(UrlQueryData || "{}");

    function sendMessageToRN(msg) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      }
    }

    let metaString = "";
    if (contentScale_s) metaString += `initial-scale=${contentScale_s}, `;
    if (!allowWebViewZoom) metaString += `maximum-scale=${contentScale_s}`;
    const viewport = document.querySelector("meta[name=viewport]");
    if (viewport && metaString) viewport.setAttribute("content", metaString);

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName("script")[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player(randomPlayerId, {
        width: "100%",
        height: "100%",
        videoId: videoId_s,
        playerVars: {
          end, list, color, start, loop: loop_s, rel: rel_s,
          listType, playlist, hl: playerLang, controls: controls_s,
          fs: preventFullScreen_s, cc_lang_pref: cc_lang_pref_s,
          iv_load_policy, modestbranding: modestbranding_s,
          playsinline: 1, enablejsapi: 1, origin: window.location.origin
        },
        events: {
          onReady: (e) => sendMessageToRN({ eventType: "playerReady" }),
          onStateChange: (e) => sendMessageToRN({ eventType: "playerStateChange", data: e.data }),
          onPlaybackQualityChange: (e) => sendMessageToRN({ eventType: "playerQualityChange", data: e.data }),
          onPlaybackRateChange: (e) => sendMessageToRN({ eventType: "playerPlaybackRateChange", data: e.data }),
          onError: (e) => sendMessageToRN({ eventType: "playerError", data: e.data })
        }
      });
    }

    window.addEventListener("message", (event) => {
      try {
        const parsed = JSON.parse(event.data);
        if (player && typeof player[parsed.action] === "function") {
          player[parsed.action](...(parsed.args || []));
        }
      } catch(err) {}
    });
  </script>
</body>
</html>
